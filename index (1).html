<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쑥쑥리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EA; --app:#FAFBF7; --card:#FFFFFF; --ink:#1E2A22; --sub:#5E6B62; --muted:#8C978F;
  --line:#E3E8DF; --green:#3E8E5A; --green-d:#2B6B42; --green-l:#E4F2E8; --leaf:#7BC47F;
  --coral:#F2785C; --coral-l:#FDEBE5; --amber:#E9A23B; --amber-l:#FBF1DE; --blue:#4A7FC1; --blue-l:#E6EEF8;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font-family:inherit;font-size:16px;color:var(--ink)}
.shell{max-width:430px;min-height:100vh;margin:0 auto;background:var(--app);position:relative;display:flex;flex-direction:column}
@media(min-width:600px){body{padding:24px 0}.shell{min-height:calc(100vh - 48px);border-radius:28px;box-shadow:0 10px 40px rgba(40,70,50,.12);overflow:hidden}}
.top{position:sticky;top:0;z-index:5;background:var(--app);display:flex;align-items:center;gap:8px;padding:14px 18px 10px;min-height:58px}
.top h1{font-size:18px;margin:0;font-weight:700;flex:1}
.back{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-left:-8px}
.back:hover{background:#eef1ea}
.main{flex:1;padding:4px 18px 110px}
.gnb{position:sticky;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.gnb button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:12px}
.gnb button.on{color:var(--green-d);font-weight:700}
.gnb svg{width:22px;height:22px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{margin:0 0 6px;font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sub{color:var(--sub);font-size:13.5px}
.muted{color:var(--muted);font-size:12.5px}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:52px;border-radius:14px;background:var(--green);color:#fff;font-weight:700;font-size:16px}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--green-l);color:var(--green-d)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.coral{background:var(--coral)}
.btn.sm{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--green-d);font-weight:500;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--green-l);color:var(--green-d)}
.chip.coral{background:var(--coral-l);color:#B2472E}.chip.amber{background:var(--amber-l);color:#91600F}.chip.gray{background:#EEF0EC;color:var(--sub)}.chip.blue{background:var(--blue-l);color:#2D5B95}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-bottom:6px}
.field input,.field select{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none}
.field input:focus{border-color:var(--green)}
.field .err{color:#C2412A;font-size:12.5px;margin-top:5px}
.field .hint{color:var(--muted);font-size:12px;margin-top:5px}
.unit{position:relative}.unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#EDF1EA;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--green-l);color:var(--green-d)}
.ico.coral{background:var(--coral-l);color:#B2472E}.ico.amber{background:var(--amber-l);color:#91600F}.ico.blue{background:var(--blue-l);color:#2D5B95}
.chev{color:#B7BFB7}
.pct{display:flex;gap:10px}
.pct .card{flex:1;margin:0;padding:14px}
.bar{height:8px;border-radius:99px;background:linear-gradient(90deg,#F7C9BC 0,#F7C9BC 3%,#FBE7B8 3%,#FBE7B8 15%,#CDE8D3 15%,#CDE8D3 85%,#FBE7B8 85%,#FBE7B8 97%,#F7C9BC 97%);position:relative;margin:10px 0 4px}
.bar i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.notice{border-radius:14px;padding:13px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.notice.coral{background:var(--coral-l);color:#7F2E1B}.notice.green{background:var(--green-l);color:#1F5232}.notice.amber{background:var(--amber-l);color:#6B4709}.notice.gray{background:#F0F2EE;color:var(--sub)}
.notice b{display:block;margin-bottom:2px}
.hero{background:linear-gradient(160deg,#4C9A66,#2F7349);color:#fff;border:0}
.hero .sub,.hero .muted{color:rgba(255,255,255,.85)}
.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:9px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:#eef1ea}
.childsw{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;flex:1}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#FFE7C7;font-size:17px;flex:none}
.sheet-bg{position:fixed;inset:0;background:rgba(20,30,24,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.dialog-bg{position:fixed;inset:0;background:rgba(20,30,24,.42);z-index:50;display:grid;place-items:center;padding:24px}
.dialog{background:#fff;border-radius:20px;padding:22px;max-width:340px;width:100%}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;background:#fff;border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.14);border-radius:16px;padding:12px 14px;width:min(400px,calc(100% - 24px));display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--green)}
.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:#D4D9D2;border-radius:99px;transition:.2s}
.toggle span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--green)}
.toggle input:checked+span:before{transform:translateX(18px)}
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(170deg,#58A872,#2D6E45);color:#fff;z-index:30}
.logo{font-family:"Jua",sans-serif;font-size:40px;letter-spacing:-1px}
.onb{display:flex;flex-direction:column;min-height:calc(100vh - 60px);padding:30px 24px 30px}
.onb-art{flex:1;display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.dots i{width:7px;height:7px;border-radius:9px;background:#CCD5CB}.dots i.on{width:20px;background:var(--green)}
.social{display:grid;gap:8px}
.social button{height:50px;border-radius:14px;font-weight:700;font-size:15px}
.k{background:#FEE500;color:#191600}.n{background:#03C75A;color:#fff}.g{background:#fff;border:1px solid var(--line)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:18px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q p{margin:0 0 9px;font-size:14.5px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opts button{height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px}
.opts button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.lock{position:relative}
.lock .blur{filter:blur(6px);user-select:none}
.lock .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.foot{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6}
.empty{text-align:center;padding:26px 10px;color:var(--sub)}
.pill-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.pill-tabs button{flex:none;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--sub)}
.pill-tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th,table.mini td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.mini th{color:var(--muted);font-weight:500;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chart text{font-family:"Noto Sans KR",sans-serif}
.adwrap{margin-top:12px}
.ad{background:#fff;border:1px solid #EAD9CF;border-radius:16px;padding:14px;margin-bottom:10px}
.adlabel{display:inline-block;font-size:11.5px;font-weight:700;color:#7A4A12;background:#FBF1DE;border:1px solid #EBCB91;border-radius:6px;padding:1px 7px}
.maplink{display:flex;align-items:center;gap:10px;margin-top:4px;padding:13px 14px;border-radius:14px;background:#EEF6EC;border:1px solid #CFE3CB;color:var(--green-d);font-weight:700;font-size:14px;text-decoration:none}
.wx{background:linear-gradient(180deg,#F3F8FD,#FFFFFF);border-color:#DCE7F2}
</style>
</head>

function lmsAt(sex, kind, m){
  const t = WHO[sex][kind]; if (m < 0 || m > t.length - 1) return null;
  const i = Math.floor(m), f = m - i; const a = t[i], b = t[Math.min(i+1, t.length-1)];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
function zOf(x, [L,M,S]){ return Math.abs(L) < 1e-6 ? Math.log(x/M)/S : (Math.pow(x/M, L) - 1) / (L*S); }

function notify(title, body, target, kind='info'){
  const n = {id:uid(), title, body, target, kind, date:todayStr(), read:false, child:S.active};
  S.notifs.unshift(n); S.notifs = S.notifs.slice(0, 40); save(); toast(title, body, target);
}
function toast(title, body, target){
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status');
  el.innerHTML = `<div class="ico" style="width:34px;height:34px">${icon.bell}</div><div style="flex:1"><b style="font-size:14px">${esc(title)}</b><div class="sub" style="font-size:13px">${esc(body)}</div></div>`;
  el.onclick = () => { el.remove(); if (target) go(target); };
  document.body.appendChild(el); setTimeout(() => el.remove(), 4200);
}

  ${weatherCard(false)}
  ${summary}

  ${L && healthFlags(c, L).includes('obese') ? `<div class="notice amber" style="margin-bottom:4px;cursor:pointer" data-a="go" data-v="result" data-p="${L.id}"><span>${icon.info}</span><div><b>체질량지수가 또래보다 많이 높아요</b>키에 비해 몸무게가 많이 나가는 편이에요. 결과 자세히 보기</div></div>` : ''}
  ${L ? healthAds(c, L) : ''}
  <button class="btn" style="margin:12px 0" data-a="go" data-v="recordForm">${icon.plus} 키·몸무게 기록하기</button>

  ${pred ? `<div class="card"><div class="between"><h3>예상 성인 키</h3><span class="chip gray">부모 키 기반</span></div><div class="big" style="color:var(--green-d)">${pred.lo.toFixed(1)}~${pred.hi.toFixed(1)}<small style="font-size:15px"> cm</small></div><p class="muted" style="margin:4px 0 0">중간부모키 ${pred.mid.toFixed(1)}cm ± 2cm · 예상치이며 진단이 아니에요</p></div>` : `<div class="card" data-a="editChild" style="cursor:pointer"><div class="between"><div><h3>예상 성인 키</h3><p class="sub" style="margin:0">부모 키를 입력하면 범위를 알려드려요</p></div><span class="chev">${icon.chev}</span></div></div>`}

function schedItem(c, it){

}

/* H02 / R04 chart */
function chartSVG(c, kind, {mini=false}={}){
  const maxT = kind === 'h' ? 72 : 60;
  const rs = sorted(c).filter(r => r[kind] != null && r[kind] !== '').map(r => ({m: ageM(c.birth, r.date), v: +r[kind]})).filter(p => p.m <= maxT);
  const now = Math.min(maxT, ageM(c.birth, todayStr()));
  let x0 = 0, x1 = Math.min(maxT, Math.max(6, Math.ceil(now + 3)));
  if (mini && x1 > 18){ x0 = Math.max(0, Math.floor(now - 15)); }
  const W = 340, H = mini ? 170 : 260, pl = 34, pr = 34, pt = 10, pb = 26;
  let ys = [];
  for (let m = x0; m <= x1; m += 0.5){ const l = lmsAt(c.sex, kind, m); if (l){ ys.push(xOf(-2.2, l), xOf(2.2, l)); } }
  rs.forEach(p => { if (p.m >= x0) ys.push(p.v); });
  let y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
  const X = m => pl + (m - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const curve = z => { let d = ''; for (let m = x0; m <= x1 + 1e-9; m += 0.25){ const l = lmsAt(c.sex, kind, m); if (!l) continue; d += (d ? 'L' : 'M') + X(m).toFixed(1) + ',' + Y(xOf(z, l)).toFixed(1); } return d; };
  const area = (za, zb) => { let a = [], b = []; for (let m = x0; m <= x1 + 1e-9; m += 0.5){ const l = lmsAt(c.sex, kind, m); if (!l) continue; a.push(`${X(m).toFixed(1)},${Y(xOf(za,l)).toFixed(1)}`); b.unshift(`${X(m).toFixed(1)},${Y(xOf(zb,l)).toFixed(1)}`); } return 'M' + a.join('L') + 'L' + b.join('L') + 'Z'; };
  const ticks = []; const step = (x1 - x0) > 36 ? 12 : (x1 - x0) > 14 ? 6 : 2;
  for (let m = Math.ceil(x0/step)*step; m <= x1; m += step) ticks.push(m);
  const ystep = kind === 'h' ? ((y1 - y0) > 40 ? 10 : 5) : ((y1 - y0) > 12 ? 4 : 2);
  const yt = []; for (let v = Math.ceil(y0/ystep)*ystep; v <= y1; v += ystep) yt.push(v);
  const lastL = lmsAt(c.sex, kind, x1);
  const lab = (pp, z) => lastL ? `<text x="${W - pr + 3}" y="${Y(xOf(z,lastL)) + 3.5}" font-size="9.5" fill="#8C978F">${pp}</text>` : '';
  const pts = rs.filter(p => p.m >= x0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${kind==='h'?'키':'몸무게'} 성장곡선">
  <path d="${area(ZP[3],ZP[97])}" fill="#FBF1DE"/><path d="${area(ZP[15],ZP[85])}" fill="#E4F2E8"/>
  ${yt.map(v => `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEF1EB"/><text x="${pl-5}" y="${Y(v)+3.5}" font-size="9.5" fill="#8C978F" text-anchor="end">${v}</text>`).join('')}
  ${ticks.map(m => `<text x="${X(m)}" y="${H-8}" font-size="9.5" fill="#8C978F" text-anchor="middle">${m}개월</text>`).join('')}
  ${[3,15,85,97].map(pp => `<path d="${curve(ZP[pp])}" fill="none" stroke="#C9D3C6" stroke-width="1" stroke-dasharray="${pp===3||pp===97?'3 3':''}"/>`).join('')}
  <path d="${curve(0)}" fill="none" stroke="#7BAF87" stroke-width="1.6"/>
  ${lab('97%',ZP[97])}${lab('85%',ZP[85])}${lab('50%',0)}${lab('15%',ZP[15])}${lab('3%',ZP[3])}
  ${pts.length > 1 ? `<path d="${pts.map((p,i) => (i?'L':'M') + X(p.m).toFixed(1) + ',' + Y(p.v).toFixed(1)).join('')}" fill="none" stroke="#F2785C" stroke-width="2"/>` : ''}
  ${pts.map(p => `<circle cx="${X(p.m)}" cy="${Y(p.v)}" r="4" fill="#fff" stroke="#F2785C" stroke-width="2.2"/>`).join('')}
  <text x="${pl}" y="${pt+8}" font-size="9.5" fill="#8C978F">${kind==='h'?'cm':'kg'}</text>
  </svg>`;
}
V.chart = ({kind='h'}={}) => {
  const c = child();
  return `${topbar('성장곡선')}<div class="main"><div class="seg"><button class="${kind==='h'?'on':''}" data-a="chartKind" data-v="h">키</button><button class="${kind==='w'?'on':''}" data-a="chartKind" data-v="w">몸무게</button></div>
  <div class="card">${chartSVG(c, kind)}<div class="row" style="flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px" class="muted"><span><span style="display:inline-block;width:12px;height:12px;background:#E4F2E8;border-radius:3px;vertical-align:-2px"></span> 15~85% (보통)</span><span><span style="display:inline-block;width:12px;height:12px;background:#FBF1DE;border-radius:3px;vertical-align:-2px"></span> 3~97% (정상 범위)</span><span><span style="display:inline-block;width:10px;height:10px;border:2px solid #F2785C;border-radius:50%;vertical-align:-1px"></span> ${esc(c.name)}</span></div></div>
  <p class="foot">성장곡선은 WHO 성장기준(LMS)으로 그렸어요. 질병관리청 2017 소아청소년 성장도표는 만 3세 미만에 이 기준을 그대로 사용해요. 만 3세 이후는 국내 기준과 차이가 있을 수 있어요.</p></div>`;
};

/* R01 record tab */
V.record = ({seg='list'}={}) => {
  const c = child(); const rs = sorted(c).reverse();
  let body = '';
  if (seg === 'list'){
    body = rs.length ? `<div class="card" style="padding:4px 16px">${rs.map(r => { const e = evalRec(c, r); return `<div class="list-item" data-a="go" data-v="result" data-p="${r.id}" style="cursor:pointer"><div class="ico">${icon.ruler}</div><div class="grow"><div style="font-weight:500">${fmt(r.date)} <span class="muted">· ${ageLabel(c.birth, r.date)}</span></div><div class="sub">${r.h?`키 ${r.h}cm`:''}${r.h&&r.w?' · ':''}${r.w?`몸무게 ${r.w}kg`:''}${r.hc?` · 머리둘레 ${r.hc}cm`:''}</div></div>${e.h && !e.h.na ? `<span class="chip ${band(e.h.p).chip}">${pRound(e.h.p)}%</span>`:''}</div>`; }).join('')}</div>` : `<div class="card empty"><div style="font-size:40px">📏</div><p>아직 기록이 없어요.<br>첫 키·몸무게를 기록해 보세요.</p></div>`;
  } else if (seg === 'chart'){
    body = `<div class="card">${chartSVG(c,'h')}</div><div class="card">${chartSVG(c,'w')}</div>`;
  } else body = trendBody(c);
  return `${childHeader()}<div class="main"><div class="seg"><button class="${seg==='list'?'on':''}" data-a="recSeg" data-v="list">기록 목록</button><button class="${seg==='chart'?'on':''}" data-a="recSeg" data-v="chart">성장곡선</button><button class="${seg==='trend'?'on':''}" data-a="recSeg" data-v="trend">성장 흐름</button></div>
  <button class="btn" style="margin-bottom:12px" data-a="go" data-v="recordForm">${icon.plus} 키·몸무게 기록하기</button>${body}
  ${rs.length ? `<button class="btn line" data-a="go" data-v="report">${icon.doc} 성장 리포트 보기·공유</button>` : ''}</div>${gnb('record')}`;
};

/* R05 trend */
function trendBody(c){
  const rs = sorted(c).filter(r => r.h);
  if (rs.length < 2) return `<div class="card empty"><div style="font-size:40px">📈</div><p>기록이 2회 이상 쌓이면<br>성장 흐름을 분석해 드려요.</p></div>`;
  const rows = rs.map(r => ({r, e: evalRec(c, r)})).filter(x => x.e.h && !x.e.h.na);
  const t = trendOf(c,'h');
  return `${t && t.alert ? `<div class="notice amber" style="margin-bottom:12px"><span>${icon.trend}</span><div><b>최근 성장 흐름이 달라졌어요</b>지난 측정보다 키 백분위가 ${t.dz>0?'크게 올랐어요':'크게 내려갔어요'} (${pRound(t.from)}% → ${pRound(t.to)}%). 측정 오차일 수도 있으니 다음 측정에서 다시 확인하고, 계속되면 소아청소년과와 상담해 보세요.</div></div>` : `<div class="notice green" style="margin-bottom:12px"><span>${icon.trend}</span><div><b>꾸준한 흐름이에요</b>최근 기록에서 백분위가 크게 바뀌지 않았어요.</div></div>`}
  <div class="card"><h3>키 백분위 변화</h3><table class="mini"><tr><th>날짜</th><th>월령</th><th>키</th><th>백분위</th></tr>${rows.reverse().map(x => `<tr><td>${fmt(x.r.date)}</td><td>${ageLabel(c.birth, x.r.date)}</td><td>${x.r.h}cm</td><td>${pRound(x.e.h.p)}%</td></tr>`).join('')}</table></div>
  <p class="foot">백분위가 주요 기준선(3·15·50·85·97%) 하나 이상을 건너뛸 만큼(약 0.67 표준편차) 바뀌면 알려드려요.</p>`;
}
V.trend = () => `${topbar('성장 흐름')}<div class="main">${trendBody(child())}</div>`;

/* R02 record form */
V.recordForm = ({errs={}, vals={}, confirm}={}) => {
  const c = child();
  return `${topbar('키·몸무게 기록하기')}<form class="main" id="fRec" novalidate style="padding-bottom:40px">
  <p class="sub" style="margin:0 0 16px">${esc(c.name)} · ${ageLabel(c.birth)}</p>
  <div class="field"><label for="rd">측정 날짜</label><input id="rd" type="date" min="${c.birth}" max="${todayStr()}" value="${vals.date||todayStr()}">${errs.date?`<div class="err">${errs.date}</div>`:''}</div>
  <div class="field"><label for="rh">키</label><div class="unit"><input id="rh" type="number" inputmode="decimal" step="0.1" placeholder="예: 85.3" value="${vals.h??''}"><span>cm</span></div>${errs.h?`<div class="err">${errs.h}</div>`:''}</div>
  <div class="field"><label for="rw">몸무게</label><div class="unit"><input id="rw" type="number" inputmode="decimal" step="0.01" placeholder="예: 11.8" value="${vals.w??''}"><span>kg</span></div>${errs.w?`<div class="err">${errs.w}</div>`:''}</div>
  <div class="field"><label for="rhc">머리둘레 (선택)</label><div class="unit"><input id="rhc" type="number" inputmode="decimal" step="0.1" value="${vals.hc??''}"><span>cm</span></div><div class="hint">머리둘레는 기록만 해 두고, 백분위 분석은 다음 버전에서 제공해요</div></div>
  ${errs.any?`<div class="err" style="color:#C2412A;font-size:13px;margin:-4px 0 12px">${errs.any}</div>`:''}
  ${confirm ? `<div class="notice amber" style="margin-bottom:12px"><span>${icon.info}</span><div><b>입력값을 한 번 더 확인해 주세요</b>${esc(confirm)}<div class="row" style="margin-top:10px"><button type="button" class="btn sm line" data-a="fixRec">다시 입력</button><button type="button" class="btn sm" data-a="forceRec">맞아요, 저장</button></div></div></div>` : ''}
  <button class="btn" type="submit">저장하고 결과 보기</button>
  <p class="foot">집에서 잴 때는 2세 미만은 누워서, 2세 이상은 서서 재면 더 정확해요.</p></form>`;
};

/* R03 result */
V.result = ({id}) => {
  const c = child(); const r = c.records.find(x => x.id === id); if (!r) return V.record({});
  const e = evalRec(c, r); const t = trendOf(c,'h'); const isLast = latest(c)?.id === id;
  const block = (kind, label, unit) => {
    const v = r[kind]; if (v == null || v === '') return '';
    const x = e[kind];
    if (!x || x.na) return `<div class="card"><div class="between"><h3>${label}</h3><b>${v}${unit}</b></div><p class="sub" style="margin:0">만 5세 이후 몸무게 기준은 준비 중이에요.</p></div>`;
    const b = band(x.p);
    return `<div class="card"><div class="between"><h3>${label} <span style="font-weight:400;color:var(--sub)">${v}${unit}</span></h3><span class="chip ${b.chip}">${b.tag}</span></div>
    <div style="font-size:15px;margin-top:6px">또래 100명 중 <b style="font-size:20px">${rankOf(x.p)}번째</b>로 ${kind==='h'?'큰':'무거운'} 편</div>
    <div class="bar"><i style="left:${Math.min(99,Math.max(1,x.p))}%"></i></div><div class="between muted"><span>3%</span><span>백분위 ${pRound(x.p)}%</span><span>97%</span></div>
    <p style="margin:10px 0 0;font-size:14px">${interp(kind, x.p)}</p></div>`;
  };
  const bmiBlock = () => {
    if (!e.b || !e.b.ok) return '';
    const p = e.b.p; const t = p >= 95 ? ['비만 범위','coral','또래보다 체질량지수가 많이 높아요. 식습관과 활동량을 소아청소년과와 함께 살펴보면 좋아요.'] : p >= 85 ? ['과체중 범위','amber','또래보다 조금 높은 편이에요. 간식과 바깥 놀이 시간을 함께 살펴보세요.'] : p < 5 ? ['저체중 범위','amber','또래보다 마른 편이에요. 식사량을 소아청소년과와 함께 확인해 보세요.'] : ['정상 범위','','키에 비해 몸무게가 알맞아요.'];
    return `<div class="card"><div class="between"><h3>체질량지수(BMI) <span style="font-weight:400;color:var(--sub)">${e.b.v.toFixed(1)}</span></h3><span class="chip ${t[1]}">${t[0]}</span></div>
    <div class="bar"><i style="left:${Math.min(99,Math.max(1,p))}%"></i></div><div class="between muted"><span>5%</span><span>백분위 ${pRound(p)}%</span><span>95%</span></div>
    <p style="margin:10px 0 0;font-size:14px">${t[2]}</p></div>`;
  };
  const consultNeed = (e.h && !e.h.na && needConsult(e.h.p)) || (e.w && !e.w.na && needConsult(e.w.p)) || (e.b && e.b.ok && (e.b.p >= 95 || e.b.p < 5));
  const allOk = !consultNeed;
  return `${topbar('기록 결과')}<div class="main">
  <p class="sub" style="margin:0 0 12px">${fmt(r.date)} · ${ageLabel(c.birth, r.date)}</p>
  ${allOk ? `<div class="notice green" style="margin-bottom:12px;font-size:15px"><span style="font-size:22px">🌱</span><div><b style="font-size:16px">잘 자라고 있어요</b>정상 범위 안에서 자라고 있어요.</div></div>` : ''}
  ${block('h','키','cm')}${block('w','몸무게','kg')}${bmiBlock()}
  ${consultNeed ? consult() : ''}
  ${isLast && t && t.alert ? `<div class="notice amber" style="margin-top:12px;cursor:pointer" data-a="go" data-v="trend"><span>${icon.trend}</span><div><b>성장 흐름이 달라졌어요</b>지난 기록보다 키 백분위가 ${pRound(t.from)}% → ${pRound(t.to)}%로 바뀌었어요. 자세히 보기</div></div>` : ''}
  ${healthAds(c, r)}
  <div class="row" style="margin-top:14px"><button class="btn line" data-a="go" data-v="chart">성장곡선 보기</button><button class="btn" data-a="go" data-v="report">리포트 저장·공유</button></div>
  <button class="link" style="display:block;margin:16px auto 0;color:#B2472E" data-a="delRec" data-v="${r.id}">이 기록 삭제</button>
  <p class="foot">백분위는 WHO 성장기준(LMS)으로 계산했어요. 이 결과는 참고용이며 의학적 진단이 아니에요.</p></div>`;
};

/* R06 report */
function reportText(c){
  const L = latest(c); const e = L ? evalRec(c, L) : null; const p = predicted(c);
  const lines = [`[쑥쑥리포트] ${c.name} 성장 요약 (${fmt(todayStr())})`, `생년월일 ${fmt(c.birth)} · ${c.sex==='M'?'남아':'여아'} · ${ageLabel(c.birth)}`];
  if (L){ lines.push(`최근 기록 ${fmt(L.date)}: 키 ${L.h ?? '-'}cm${e.h && !e.h.na ? ` (백분위 ${pRound(e.h.p)}%)` : ''}, 몸무게 ${L.w ?? '-'}kg${e.w && !e.w.na ? ` (백분위 ${pRound(e.w.p)}%)` : ''}`); }
  const t = trendOf(c,'h'); if (t) lines.push(`키 백분위 변화: ${pRound(t.from)}% → ${pRound(t.to)}%`);
  if (p) lines.push(`예상 성인 키(부모 키 기반): ${p.lo.toFixed(1)}~${p.hi.toFixed(1)}cm`);
  lines.push('기록 내역:'); sorted(c).forEach(r => lines.push(`- ${fmt(r.date)} 키 ${r.h ?? '-'}cm / 몸무게 ${r.w ?? '-'}kg${r.hc ? ` / 머리둘레 ${r.hc}cm` : ''}`));
  lines.push('※ WHO 성장기준(LMS) 기반 참고 자료이며 진단이 아닙니다.');
  return lines.join('\n');
}
V.report = () => {
  const c = child(); const txt = reportText(c);
  return `${topbar('성장 리포트')}<div class="main">
  <div class="card"><h3>${esc(c.name)} 성장 요약</h3><pre style="white-space:pre-wrap;font-family:inherit;font-size:13.5px;margin:8px 0 0;color:var(--sub)">${esc(txt)}</pre></div>
  <button class="btn" data-a="copyReport">요약 복사하기</button>

  <div class="card lock"><div class="blur"><h3>상세 성장 리포트 (PDF)</h3><p class="sub">성장곡선 전체, 백분위 추이 그래프, 검진·접종 이력, 소아과 상담용 요약 페이지</p><div style="height:80px;background:#F0F3EE;border-radius:12px"></div></div>
  ${S.premium ? `<div class="over"><span class="chip">구독 중</span><p class="sub" style="margin:0">PDF 내려받기는 정식 버전에서 제공돼요.</p></div>` : `<div class="over"><span style="color:var(--green-d)">${icon.lock}</span><b>프리미엄 성장 리포트</b><button class="btn sm" data-a="go" data-v="premium">자세히 보기</button></div>`}</div>
  </div>`;

/* C01 checkup */
V.checkup = ({f='all'}={}) => {
  const c = child();
  let items = [...CHECKUPS, ...VACCINES].map(it => ({it, w: windowOf(c,it), st: statusOf(c,it)}));
  if (f === '검진') items = items.filter(x => x.it.type === '검진'); if (f === '접종') items = items.filter(x => x.it.type === '접종');
  if (f === 'todo') items = items.filter(x => ['now','late','soon'].includes(x.st.k));
  items.sort((a,b) => a.w.s.localeCompare(b.w.s));
  const now = items.filter(x => ['now','late','soon'].includes(x.st.k)), later = items.filter(x => x.st.k === 'later'), done = items.filter(x => x.st.k === 'done');
  const sec = (t, arr) => arr.length ? `<h4 style="margin:16px 2px 6px;font-size:13.5px;color:var(--sub)">${t} <span class="muted">${arr.length}</span></h4><div class="card" style="padding:2px 16px">${arr.map(x => schedItem(c, x.it)).join('')}</div>` : '';
  return `${childHeader()}<div class="main">
  <div class="pill-tabs">${[['all','전체'],['todo','챙길 일정'],['검진','건강검진'],['접종','예방접종']].map(([k,l]) => `<button class="${f===k?'on':''}" data-a="ckF" data-v="${k}">${l}</button>`).join('')}</div>
  ${sec('지금 챙겨야 해요', now)}${f==='todo'?'':sec('예정', later.slice(0, 12))}${f==='todo'?'':sec('완료', done)}

  <p class="foot">영유아 건강검진(8회)·구강검진(4회) 시기는 국민건강보험공단 기준이에요. 예방접종은 표준 일정 예시이며, 정확한 일정은 질병관리청 예방접종도우미(nip.kdca.go.kr)에서 확인하세요.</p></div>${gnb('checkup')}`;
};

function devBand(c){ const m = ageM(c.birth, todayStr()); return DEV.find(d => m >= d.a && m <= d.b); }
function nextDev(c){ const m = ageM(c.birth, todayStr()); return DEV.find(d => d.a > m); }

function readRec(){ return {date: $('#rd').value, h: $('#rh').value, w: $('#rw').value, hc: $('#rhc').value}; }
function submitRec(force){
  const c = child(); const vals = R.params.vals && force ? R.params.vals : readRec(); const errs = {};
  if (!vals.date) errs.date = '측정 날짜를 입력해 주세요.'; else if (vals.date < c.birth) errs.date = '생일 이전 날짜예요.'; else if (vals.date > todayStr()) errs.date = '오늘 이후 날짜는 입력할 수 없어요.';
  if (!vals.h && !vals.w) errs.any = '키나 몸무게 중 하나 이상 입력해 주세요.';
  if (vals.h && !(+vals.h > 30 && +vals.h < 160)) errs.h = '키는 30~160cm 사이로 입력해 주세요.';
  if (vals.w && !(+vals.w > 1 && +vals.w < 60)) errs.w = '몸무게는 1~60kg 사이로 입력해 주세요.';
  if (Object.keys(errs).length){ R.params = {errs, vals}; render(); return; }
  if (!force){
    const m = ageM(c.birth, vals.date); const msgs = [];
    for (const k of ['h','w']){ if (!vals[k]) continue; const l = lmsAt(c.sex, k, m); if (!l) continue; const z = zOf(+vals[k], l); if (Math.abs(z) > 4) msgs.push(`${k==='h'?'키':'몸무게'} ${vals[k]}${k==='h'?'cm':'kg'}는 이 월령에서 매우 드문 값이에요.`); }
    if (msgs.length){ R.params = {vals, confirm: msgs.join(' ') + ' 단위나 소수점을 확인해 주세요.'}; render(); return; }
  }
  const r = {id: uid(), date: vals.date, h: vals.h ? +vals.h : null, w: vals.w ? +vals.w : null, hc: vals.hc ? +vals.hc : null};
  c.records.push(r); syncAccount(); save();
  R = {name:'result', params:{id: r.id}}; render(); window.scrollTo(0,0);
  const t = trendOf(c, 'h');
  if (latest(c).id === r.id && t && t.alert && S.settings.trend) setTimeout(() => notify('성장 흐름이 달라졌어요', `${c.name}의 키 백분위가 ${pRound(t.from)}% → ${pRound(t.to)}%로 바뀌었어요.`, 'trend', 'trend'), 900);
}
function syncAccount(){ if (S.user && S.accounts[S.user.email]) S.accounts[S.user.email].children = S.children; }
function afterLogin(){ hist.length = 0; if (!S.children.length){ R = {name:'childForm', params:{first:true}}; render(); } else tab('home'); }

    case 'forceRec': submitRec(true); break;
    case 'delRec': dialog('기록을 삭제할까요?', '삭제한 기록은 되돌릴 수 없어요.', '삭제', () => { c.records = c.records.filter(r => r.id !== v); syncAccount(); save(); back(); }, true); break;
    case 'copyReport': { const txt = reportText(c); try { navigator.clipboard.writeText(txt).then(() => toast('복사했어요', '메신저에 붙여 넣어 공유하세요.'), () => toast('복사하지 못했어요', '리포트 내용을 길게 눌러 직접 복사해 주세요.')); } catch(e){ toast('복사하지 못했어요', '리포트 내용을 길게 눌러 직접 복사해 주세요.'); } break; }
    case 'ckF': R.params = {f: v}; render(); break;
    case 'done': c.done = c.done || {}; c.done[v] = todayStr(); syncAccount(); save(); toast('완료로 기록했어요', '다음 일정도 챙겨 드릴게요.'); render(); break;
    case 'undone': delete c.done[v]; syncAccount(); save(); render(); break;
    case 'devAns': { const ans = R.params.ans; ans[+v] = +p; R.params.ans = ans; render(); break; }
    case 'devSubmit': { const ans = R.params.ans; if (ans.some(x => x == null)){ $('#devErr').textContent = '모든 문항에 답해 주세요.'; return; }
      c.dev = c.dev || {}; c.dev[v] = {date: todayStr(), ans: [...ans], flag: ans.filter(x => x === 2).length >= 2}; syncAccount(); save(); R = {name:'devRes', params:{id: v}}; render(); window.scrollTo(0,0);
      if (S.settings.dev){ const d = DEV[DEV.findIndex(x => x.id === v)+1]; if (d) setTimeout(() => toast('다음 체크 알림을 예약했어요', `${d.name}가 되면 알려드릴게요.`), 700); } break; }
    case 'sub': S.premium = true; save(); toast('프리미엄 체험 시작 (시연)', '실제 결제는 일어나지 않았어요.'); render(); break;
    case 'unsub': S.premium = false; save(); render(); break;
    case 'logout': dialog('로그아웃할까요?', '기록은 이 브라우저에 그대로 남아 있어요.', '로그아웃', () => { syncAccount(); S.user = null; S.children = []; S.active = null; save(); hist.length = 0; go('login', {}, false); }); break;
    case 'wipe': dialog('탈퇴할까요?', '계정과 모든 아이 기록이 삭제돼요. 되돌릴 수 없어요.', '탈퇴', () => { if (S.user) delete S.accounts[S.user.email]; const acc = S.accounts; S = blank(); S.accounts = acc; S.onboarded = true; save(); hist.length = 0; go('login', {}, false); toast('탈퇴했어요', '그동안 함께해 주셔서 고마워요.'); }, true); break;
    case 'addr': openAddr(); break;
    case 'tsex': $('#ts').value = v; document.querySelectorAll('[data-a=tsex]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); break;
    case 'trialJoin': go('signup'); break;
    case 'trialShare': toast('공유 이미지 만들기 (시연)', '또래 비교 결과만 담긴 이미지를 친구에게 보낼 수 있어요.'); break;
    case 'addrEx': $('#ad').value = v; $('#adErr').textContent = ''; break;
    case 'wxMode': S.wxMode = v; save(); render(); break;
    case 'adInfo': sheet(`<span class="adlabel">광고</span><h3 style="margin:8px 0 4px">${esc(v)} <span class="muted" style="font-weight:400">(예시 광고주)</span></h3><p class="sub">시연용 예시 광고예요. 실서비스에서는 건강보험심사평가원 병원정보(공공데이터)로 확인한 진료과·위치와 광고주가 등록한 정보를 함께 보여 드려요.</p><button class="btn line" data-a="closeLayer">닫기</button>`); break;
    case 'adCall': toast('예약 문의 (시연)', `${v}에 문의하는 화면으로 이동해요. 시연판이라 실제 연결은 되지 않아요.`); break;
    case 'adWhy': { const set = AD_SETS[v]; sheet(`<h3 style="margin:0 0 8px">왜 이 광고가 보이나요?</h3><p class="sub">${set.why}</p><p class="sub">광고를 고를 때만 기록 결과를 쓰고, 병원이나 광고주에게 아이 정보를 보내지 않아요.</p><button class="btn line" data-a="go" data-v="settings">맞춤 광고 끄기</button>`); break; }
    case 'readAll': S.notifs.forEach(n => n.read = true); save(); render(); break;
    case 'openNotif': { const n = S.notifs.find(x => x.id === v); n.read = true; if (n.child && S.children.some(x => x.id === n.child)) S.active = n.child; save(); go(n.target || 'home'); break; }
  }
});
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.a) return;
  const c = child();
  if (el.dataset.a === 'setting'){ S.settings[el.dataset.v] = el.checked; save(); }
  if (el.dataset.a === 'remind'){ c.remind = c.remind || {}; c.remind[el.dataset.v] = el.checked; syncAccount(); save(); if (el.checked) toast('알림을 예약했어요', '시작 7일 전에 알려드릴게요.'); }
});

/* start */
render();
setTimeout(() => { if (S.user) afterLogin(); else go(S.onboarded ? 'login' : 'onboarding', {}, false); }, 1300);
</script>
</body>
</html>
